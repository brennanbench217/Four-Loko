<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Valley Fantasy Football League</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

.video-container {
    max-width: 900px;
    margin: auto;
}

video {
    width: 100%;
    border-radius: 12px;
}

.footer {
    margin-top: 25px;
    color: #777;
    font-size: 14px;
}
</style>

</head>

<body>

<h1>Happy Valley Fantasy Football League</h1>

<div class="subtitle">
2026 Fantasy Football Punishment Archive
</div>


<div class="video-container">

<video id="leagueVideo" controls playsinline preload="metadata">

    <source src="https://res.cloudinary.com/vcobq2ny/video/upload/v1784959543/IMG_6046-compressed_nbi5ty_tqhog3.mp4" type="video/mp4">

    Your browser does not support this video.

</video>

</div>


<div class="footer">
Happy Valley Fantasy Football League
</div>


<script>

const video = document.getElementById("leagueVideo");

let maxWatchedTime = 0;
let seeking = false;


// Save the furthest point actually watched
video.addEventListener("timeupdate", function () {

    if (!seeking && video.currentTime > maxWatchedTime) {
        maxWatchedTime = video.currentTime;
    }

});


// Detect attempts to jump ahead
video.addEventListener("seeking", function () {

    seeking = true;

    if (video.currentTime > maxWatchedTime + 1) {
        video.currentTime = maxWatchedTime;
    }

});


// Resume tracking
video.addEventListener("seeked", function () {

    seeking = false;

});

</script>


</body>

</html>
