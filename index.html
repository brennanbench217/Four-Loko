<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Valley Fantasy Football League</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

.video-container {
    max-width: 900px;
    margin: auto;
}

video {
    width: 100%;
    border-radius: 12px;
}

button {
    margin-top: 20px;
    padding: 12px 30px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

.footer {
    margin-top: 25px;
    color: #777;
    font-size: 14px;
}
</style>

</head>

<body>

<h1>Happy Valley Fantasy Football League</h1>

<div class="subtitle">
2026 Fantasy Football Punishment Archive
</div>


<div class="video-container">

<video id="leagueVideo" playsinline preload="metadata">

    <source src="https://res.cloudinary.com/vcobq2ny/video/upload/v1784959543/IMG_6046-compressed_nbi5ty_tqhog3.mp4" type="video/mp4">

</video>

</div>


<button onclick="toggleVideo()">Play / Pause</button>


<div class="footer">
Happy Valley Fantasy Football League
</div>


<script>

const video = document.getElementById("leagueVideo");

function toggleVideo() {

    if (video.paused) {
        video.play();
    } else {
        video.pause();
    }

}


// Prevent keyboard shortcuts from skipping
document.addEventListener("keydown", function(event) {

    if (
        event.key === "ArrowRight" ||
        event.key === "ArrowLeft" ||
        event.key === " "
    ) {
        event.preventDefault();
    }

});

</script>


</body>

</html>
