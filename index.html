<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Valley Fantasy Football League</title>

<style>
body {
    background-color: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 28px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

video {
    width: 95%;
    max-width: 900px;
    border-radius: 12px;
}

.footer {
    margin-top: 20px;
    color: #888;
    font-size: 14px;
}
</style>

</head>

<body>

<h1>Happy Valley Fantasy Football League</h1>

<div class="subtitle">
2026 Season Media Archive
</div>

<video id="leagueVideo" controls playsinline preload="metadata">

    <source src="https://res.cloudinary.com/vcobq2ny/video/upload/v1784959543/IMG_6046-compressed_nbi5ty_tqhog3.mp4" type="video/mp4">

    Your browser does not support this video.

</video>

<div class="footer">
Happy Valley Fantasy Football League • Official Archive
</div>


<script>

const video = document.getElementById("leagueVideo");

let maxWatchedTime = 0;

// Track legitimate viewing progress
video.addEventListener("timeupdate", function () {
    if (!video.seeking && video.currentTime > maxWatchedTime) {
        maxWatchedTime = video.currentTime;
    }
});

// Prevent jumping ahead
video.addEventListener("seeking", function () {
    if (video.currentTime > maxWatchedTime + 1) {
        video.currentTime = maxWatchedTime;
    }
});

</script>

</body>

</html>
